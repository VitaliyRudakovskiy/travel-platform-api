name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels its run in progress; runs on main are never cancelled (each one bumps the version)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: "0" # no git hooks on CI machines
  TRIVY_IMAGE: aquasec/trivy:0.67.2

# Graph:
#   dependencies ─┬─ lint ──────┐
#                 ├─ format ────┤
#                 ├─ typecheck ─┼─ build ─────────────┬─ version ── docker (main only)
#                 └─ test ──────┴─ integration-tests ─┘
#   security (independent, never fails the run)
jobs:
  # Installs once with the lockfile and fills the pnpm store cache that every other job restores
  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          prisma-clients: "false"

  lint:
    name: lint
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          prisma-clients: "false"
      - name: oxlint
        run: pnpm lint

  format:
    name: format
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          prisma-clients: "false"
      - name: oxfmt --check
        run: pnpm format:check

  typecheck:
    name: typecheck
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: tsc --noEmit
        run: pnpm exec tsc --noEmit

  # Unit tests + coverage (threshold 60%, spec 4.6). The coverage summary goes to the job summary and,
  # on a PR, to a PR comment that is updated on every push.
  test:
    name: test
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Unit tests + coverage
        run: pnpm test:cov
      - name: Coverage report
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          vite-config-path: vitest.config.mjs

  # Integration tests against a real PostgreSQL (the suite creates and migrates travel_platform_test itself)
  integration-tests:
    name: integration-tests
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # the suite refuses any database whose name does not end with _test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/travel_platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          prisma-clients: "false"
      - name: Integration tests
        run: pnpm test:int

  build:
    name: build
    needs: [lint, format, typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: nest build --all
        run: pnpm build

  # Patch bump. On a PR it only shows the next version; after a merge into main it commits
  # "chore(release): vX.Y.Z [skip ci]" to main. It runs last so that a broken main is never bumped.
  version:
    name: version
    needs: [build, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'main' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Bump patch version
        id: bump
        run: |
          current=$(node -p "require('./package.json').version")
          npm version patch --no-git-tag-version > /dev/null
          next=$(node -p "require('./package.json').version")
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "### Version: \`$current\` → \`$next\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v$VERSION [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Preview only
        if: github.event_name == 'pull_request'
        run: echo "PR run - the bump is committed to main only after the merge" >> "$GITHUB_STEP_SUMMARY"

  # Trivy over the repository: dependency CVEs (pnpm-lock.yaml), secrets, Dockerfile/compose misconfig.
  # Report only (exit code 0): findings are listed in the job summary and never fail the run.
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs scan
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig \
            --severity CRITICAL,HIGH \
            --exit-code 0 --no-progress --skip-version-check \
            --format table --output trivy-fs.txt .
      - name: Report
        if: always()
        run: |
          {
            echo "### Trivy: repository (CRITICAL, HIGH)"
            echo '```'
            cat trivy-fs.txt 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Docker images of the stage III apps: built (not pushed) only on main, tagged with the new version,
  # then scanned by Trivy (report only)
  docker:
    name: docker (${{ matrix.app }})
    needs: version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api-gateway, auth-service, catalog-service, booking-service, notification-service]
    env:
      IMAGE: travel-platform/${{ matrix.app }}:${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: true # into the local daemon, for the Trivy scan
          tags: ${{ env.IMAGE }}
          # layer cache in the GitHub Actions cache: the pnpm install layers are reused between runs
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --severity CRITICAL,HIGH \
            --exit-code 0 --no-progress --skip-version-check \
            --format table "$IMAGE" > trivy-image.txt
      - name: Report
        if: always()
        run: |
          {
            echo "### Trivy: $IMAGE (CRITICAL, HIGH)"
            echo '```'
            cat trivy-image.txt 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
