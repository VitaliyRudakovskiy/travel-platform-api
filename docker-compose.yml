x-service-postgres: &service-postgres
  image: postgres:17-trixie
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  postgres:
    image: postgres:17-trixie
    container_name: travel-platform-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travel_platform

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: travel-platform-mailhog
    restart: unless-stopped

    ports:
      - "1025:1025"
      - "8025:8025"

  postgres-auth:
    <<: *service-postgres
    container_name: travel-auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data

  postgres-catalog:
    <<: *service-postgres
    container_name: travel-catalog-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catalog_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_catalog_data:/var/lib/postgresql/data

  postgres-booking:
    <<: *service-postgres
    container_name: travel-booking-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_booking_data:/var/lib/postgresql/data

  postgres-notify:
    <<: *service-postgres
    container_name: travel-notify-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notify_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_notify_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: travel-rabbitmq
    restart: unless-stopped

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: travel-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------------------------
  # Stage III microservices: `docker compose --profile app up -d --build`
  # Only the gateway (3000) is published; services talk to each other over the compose network.
  # Ports of the services for direct debugging: add `-f docker-compose.yml -f docker-compose.debug.yml`.
  # ---------------------------------------------------------------------------------------------

  # One-shot jobs (exit 0) from the `build` target, which has the Prisma / TypeORM CLIs and tsx.
  # Seeds are idempotent, so `up` can be repeated.
  auth-migrate:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/auth-service/Dockerfile, target: build }
    container_name: travel-auth-migrate
    command: ["sh", "-c", "pnpm migrate:deploy:auth && pnpm seed:auth"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-auth:5432/auth_db
    depends_on:
      postgres-auth: { condition: service_healthy }

  catalog-migrate:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/catalog-service/Dockerfile, target: build }
    container_name: travel-catalog-migrate
    command: ["sh", "-c", "pnpm migration:run:catalog && pnpm seed:catalog"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-catalog:5432/catalog_db
    depends_on:
      postgres-catalog: { condition: service_healthy }

  booking-migrate:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/booking-service/Dockerfile, target: build }
    container_name: travel-booking-migrate
    command: ["pnpm", "migrate:deploy:booking"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-booking:5432/booking_db
    depends_on:
      postgres-booking: { condition: service_healthy }

  notify-migrate:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/notification-service/Dockerfile, target: build }
    container_name: travel-notify-migrate
    command: ["pnpm", "migrate:deploy:notify"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-notify:5432/notify_db
    depends_on:
      postgres-notify: { condition: service_healthy }

  auth-service:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/auth-service/Dockerfile }
    container_name: travel-auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-auth:5432/auth_db
      # Shared with the gateway (it verifies the tokens auth-service signs); read from the root .env
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the root .env}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      EMAIL_VERIFICATION_EXPIRES_IN: 24h
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      PORT: "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No dependency on notification-service: verification emails are best effort (a failure is only logged)
    depends_on:
      postgres-auth: { condition: service_healthy }
      auth-migrate: { condition: service_completed_successfully }

  catalog-service:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/catalog-service/Dockerfile }
    container_name: travel-catalog-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-catalog:5432/catalog_db
      GRPC_URL: 0.0.0.0:50052
      PORT: "3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres-catalog: { condition: service_healthy }
      catalog-migrate: { condition: service_completed_successfully }

  booking-service:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/booking-service/Dockerfile }
    container_name: travel-booking-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-booking:5432/booking_db
      CATALOG_HTTP_URL: http://catalog-service:3002
      CATALOG_GRPC_URL: catalog-service:50052
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PORT: "3003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres-booking: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      booking-migrate: { condition: service_completed_successfully }
      catalog-service: { condition: service_healthy }

  notification-service:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/notification-service/Dockerfile }
    container_name: travel-notification-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-notify:5432/notify_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      AUTH_SERVICE_URL: http://auth-service:3001
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      PORT: "3004"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3004/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres-notify: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      notify-migrate: { condition: service_completed_successfully }
      mailhog: { condition: service_started }

  api-gateway:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/api-gateway/Dockerfile }
    container_name: travel-api-gateway
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the root .env}
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      BOOKING_SERVICE_URL: http://booking-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # spec 4.6: health-checks in depends_on with condition service_healthy
    depends_on:
      redis: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      catalog-service: { condition: service_healthy }
      booking-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }

  # ---------------------------------------------------------------------------------------------
  # Stage I–II monolith (kept until stage III step 9): `docker compose --profile monolith up -d --build`
  # ---------------------------------------------------------------------------------------------
  migrate:
    profiles: ["monolith"]
    build:
      context: .
      target: build
    container_name: travel-platform-migrate
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/travel-platform

    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["monolith"]
    build:
      context: .
      target: runtime
    container_name: travel-platform-api
    restart: unless-stopped

    env_file:
      - path: .env
        required: false

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/travel-platform
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      PORT: ${PORT:-4200}

    ports:
      - "${PORT:-4200}:${PORT:-4200}"

    depends_on:
      migrate:
        condition: service_completed_successfully
      mailhog:
        condition: service_started

volumes:
  postgres_data:
  postgres_auth_data:
  postgres_catalog_data:
  postgres_booking_data:
  postgres_notify_data:
  rabbitmq_data:
