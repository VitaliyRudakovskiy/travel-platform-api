x-service-postgres: &service-postgres
  image: postgres:17-trixie
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  postgres:
    image: postgres:17-trixie
    container_name: travel-platform-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travel_platform

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: travel-platform-mailhog
    restart: unless-stopped

    ports:
      - "1025:1025"
      - "8025:8025"

  postgres-auth:
    <<: *service-postgres
    container_name: travel-auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data

  postgres-catalog:
    <<: *service-postgres
    container_name: travel-catalog-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catalog_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_catalog_data:/var/lib/postgresql/data

  postgres-booking:
    <<: *service-postgres
    container_name: travel-booking-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_booking_data:/var/lib/postgresql/data

  postgres-notify:
    <<: *service-postgres
    container_name: travel-notify-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notify_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_notify_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: travel-rabbitmq
    restart: unless-stopped

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: travel-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: ["app"]
    build:
      context: .
      target: build
    container_name: travel-platform-migrate
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/travel-platform

    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build:
      context: .
      target: runtime
    container_name: travel-platform-api
    restart: unless-stopped

    env_file:
      - path: .env
        required: false

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/travel-platform
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      PORT: ${PORT:-4200}

    ports:
      - "${PORT:-4200}:${PORT:-4200}"

    depends_on:
      migrate:
        condition: service_completed_successfully
      mailhog:
        condition: service_started

volumes:
  postgres_data:
  postgres_auth_data:
  postgres_catalog_data:
  postgres_booking_data:
  postgres_notify_data:
  rabbitmq_data:
